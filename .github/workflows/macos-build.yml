name: macOS build

# This workflow is the project's remote compiler: the repo is developed in
# environments that may not have Xcode, so every push gets a real
# xcodebuild pass on a macOS runner.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    # macos-15 ships Xcode 16, required to open the project format (77)
    # that current XcodeGen generates.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec macos/project.yml --project macos

      - name: Build
        run: |
          xcodebuild \
            -project macos/Dictation.xcodeproj \
            -scheme Dictation \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            build \
            CODE_SIGNING_ALLOWED=NO

      # Ad-hoc sign and zip the app so it can be downloaded and run on any
      # Apple Silicon Mac without Xcode (right-click > Open to pass Gatekeeper).
      - name: Package app artifact
        run: |
          APP="build/Build/Products/Release/Dictation.app"
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" Dictation.app.zip

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dictation-app-${{ github.sha }}
          path: Dictation.app.zip
          if-no-files-found: error
