name: Dictation

options:
  bundleIdPrefix: com.davisopp
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: 0.9.0
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  Dictation:
    type: application
    platform: macOS
    sources:
      - Dictation
    dependencies:
      - package: WhisperKit
      - package: KeyboardShortcuts
    info:
      path: Dictation/Info.plist
      properties:
        CFBundleDisplayName: Dictation
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        NSMicrophoneUsageDescription: "Dictation records your voice to transcribe it on-device."
    entitlements:
      path: Dictation/Dictation.entitlements
      properties:
        # Deliberately NOT sandboxed: Accessibility insertion + CGEvent posting
        # require a non-sandboxed process (see docs/permissions-and-distribution.md).
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_NAME: Dictation
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_STYLE: Automatic

  DictationTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - DictationTests
    dependencies:
      - target: Dictation
    settings:
      base:
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Dictation.app/Contents/MacOS/Dictation
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  Dictation:
    build:
      targets:
        Dictation: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DictationTests
