<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a5ce6" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#071a44" media="(prefers-color-scheme: dark)"><title>Catch-all Desk · Offline</title><style>
/* The offline shell shares the workspace's tokens, including dark mode, so
   losing the network never looks like landing in a different product. */
:root{
  color-scheme:light dark;
  --canvas:#eaf3ff;--surface:#ffffff;--ink:#0b1f47;--muted:#44587f;
  --border:#d5e4fb;--input:#c9dcfa;--primary:#0a5ce6;--primary-ink:#ffffff;
  --danger:#b8382f;--r-md:16px;--r-xl:28px;
}
@media (prefers-color-scheme: dark){
  :root{
    --canvas:#071a44;--surface:#10306f;--ink:#e8eefc;--muted:#94a3c4;
    --border:#1e2b4a;--input:#24345a;--primary:#7db8ff;--primary-ink:#06122b;
    --danger:#ef7f78;
  }
}
body{
  font:16px/1.6 ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  background:var(--canvas);color:var(--ink);margin:0;padding:24px;
  -webkit-font-smoothing:antialiased;
}
main{
  max-width:600px;margin:8vh auto;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--r-xl);padding:32px;
}
h1{font-size:30px;letter-spacing:-1.1px;line-height:1.15;margin:18px 0 10px}
button,a{
  display:inline-flex;align-items:center;justify-content:center;
  min-height:44px;padding:0 18px;margin:6px 6px 6px 0;
  border-radius:var(--r-md);border:1px solid transparent;
  background:var(--primary);color:var(--primary-ink);font:inherit;font-weight:600;
  text-decoration:none;cursor:pointer;
}
a{background:none;color:var(--primary);border-color:var(--input)}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,a:focus-visible{
  outline:3px solid color-mix(in oklab,var(--primary) 55%,transparent);
  outline-offset:2px;
}
p{line-height:1.6;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main><img src="/icons/icon-192.png" width="64" height="64" alt=""><h1>You’re offline.</h1><p>Catch-all Desk needs a connection to load your saved Clipboard and Documents. Nothing has been lost: your items are stored with your account and will be here when you reconnect.</p><a href="/">Try again</a></main></body></html>
